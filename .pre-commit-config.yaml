# Pre-commit configuration generated by exophial init (ansible/init.yml).
# Detected languages: typescript
# Run: pre-commit install && pre-commit run --all-files
# Never clobbered on re-run (template force=false).

# vendor/railgun-engine is vendored third-party code (fork-and-shrink base for
# the Armada protocol, SPEC.md). Kept as close to upstream as the divergence
# guard (scripts/check-vendor-divergence.mjs) allows; excluded from every hook.
exclude: ^vendor/

repos:
  # === Exophial-vendored gates ===
  # claude-md-coverage: a commit that INTRODUCES a source directory must add
  # that directory's CLAUDE.md in the same change (the Literate Code
  # Principle's enforcement corollary). The script ships in the exophial wheel
  # and `uv tool install` exposes the `exophial-check-claude-md` console
  # script on PATH, so this entry is machine-independent in any consumer repo.
  # Only NEW directories trigger — the existing baseline never retro-fails.
  # Exempt data/fixture trees with `args: [--skip, <segment>]` (consumer
  # policy; the script is repo-agnostic).
  - repo: local
    hooks:
      - id: claude-md-coverage
        name: New source directory carries its CLAUDE.md
        entry: exophial-check-claude-md
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true

  # reroute-main-commit (exo-32c): a plain `git commit` while `main`/`master`
  # is checked out in the shared integration checkout is the one write path
  # onto main nothing else guards (block_worktree_leak.py only ever sees a
  # command an agent asks Claude Code to run). This local hook fires on every
  # `git commit` from a non-integrator process, refuses the commit, and
  # captures the staged content onto a fresh `worker/<id>` branch in its own
  # worktree instead of dropping it.
  #
  # `stages: [pre-commit]` is load-bearing (exo-4ba9): an omitted `stages:`
  # key matches EVERY stage, so with `always_run: true` the guard also fired
  # on `pre-commit run --all-files [--hook-stage manual]` — a lint sweep, not
  # a commit — and `reset --hard`ed the checkout, destroying its unstaged
  # tracked files.
  - repo: local
    hooks:
      - id: reroute-main-commit
        name: Refuse a direct commit on main; reroute it to a worker branch
        entry: exophial-reroute-main-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # red-before-green-pre-push (exo-8d1.5): before a push lands, replay every
  # test the pushed commits ADD — the exact test code the commit introduces —
  # against the production tree as it stood ONE COMMIT EARLIER, and reject the
  # push if any of them already passed there. Proves a test actually caught
  # its bug before the fix landed, instead of testing.md's red-before-green
  # discipline staying documented but unenforced (the Treadset gap, 2026-07-09).
  # Staged pre-push so it only runs on `git push`, never on every commit.
  - repo: local
    hooks:
      - id: red-before-green-pre-push
        name: Newly-added tests fail before their fix (red-before-green)
        entry: exophial-red-before-green
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]

  # tdd-trailer: every commit message must carry a Tested-Behavior: or
  # TDD-Exempt: trailer (pebble exo-8d1.4). Makes the testing-doctrine
  # trailer convention load-bearing instead of merely documented -- the
  # exact gap the Treadset incident (2026-07-09) exposed: the taxonomy was
  # documented in testing.md but nothing mechanically required the trailer.
  # The script is installed by `exophial init` at scripts/git-hooks/
  # tdd-trailer.sh; this hook only fires on the commit-msg stage.
  - repo: local
    hooks:
      - id: tdd-trailer
        name: "Commit message carries a Tested-Behavior: or TDD-Exempt: trailer"
        entry: scripts/git-hooks/tdd-trailer.sh
        language: script
        stages: [commit-msg]

  # check-subtree-edits: a commit that touches a tracked subtree path (per
  # subtrees.tsv, read via exo-f66's shared exophial.subtrees.parse_subtree_prefixes)
  # must carry a `git-subtree-dir: <prefix>` trailer -- the marker
  # `git subtree merge`/`pull` (and `exophial subtree sync`) write
  # automatically, so a hand-edit inside a tracked prefix is caught before it
  # breaks the reconciliation base chain
  # (docs/decisions/2026-07-14-exophial-owned-subtree-sync.md Q3). Ported from
  # mtm's scripts/git-hooks/check-subtree-edits.sh (pebble exo-981.7); the
  # script lives at src/exophial/hooks/check_subtree_edits.py, exposed as the
  # exophial-check-subtree-edits console script (mirrors claude-md-coverage
  # above). Runs at commit-msg like tdd-trailer -- the commit message text is
  # only available at that stage. A no-op in a repo with no subtrees.tsv.
  - repo: local
    hooks:
      - id: check-subtree-edits
        name: "Subtree-path edits carry a git-subtree-dir trailer"
        entry: exophial-check-subtree-edits
        language: system
        stages: [commit-msg]

  # session-trailer (exo-0be): stamp every commit with a Session-Id: trailer
  # naming the live claude session that produced it (read from the
  # CLAUDE_CODE_SESSION_ID env var every claude invocation carries), alongside
  # the existing Co-Authored-By trailer -- so a landed commit's own message
  # names the session behind it instead of that reasoning surviving only in a
  # raw session transcript. Never rejects a commit: a process with no live
  # session id (a human's plain shell) is a silent no-op. Runs at commit-msg
  # like tdd-trailer/check-subtree-edits above, since the commit message text
  # it stamps is only available at that stage.
  - repo: local
    hooks:
      - id: session-trailer
        name: "Stamp every commit with the session that produced it"
        entry: exophial-session-trailer
        language: system
        stages: [commit-msg]

  # === Base hooks ===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # === JavaScript/TypeScript: ESLint ===
  # Run from the repo's own node_modules (npm ci first), matching the
  # devDependency pin (eslint ^8.57.0) and the legacy .eslintrc.cjs format.
  # ESLint 9 (the pre-commit mirror's pinned version) refuses a legacy
  # .eslintrc.cjs outright ("couldn't find an eslint.config.(js|mjs|cjs)
  # file") and this repo has not migrated to flat config.
  #
  # docs/.vitepress/ is excluded: ESLint 8 default-ignores any dot-prefixed
  # directory, but only WARNS (instead of silently skipping) when pre-commit
  # passes such a path explicitly on the command line -- the repo's own `npm
  # run lint` (`eslint . --ext .ts`) never hits this, since it discovers
  # files by directory traversal, where the same default ignore is silent.
  # docs/.vitepress/theme/index.ts is also outside tsconfig.json's "include"
  # (src, test, tsup.config.ts, vitest.config.ts): never part of the typed
  # source tree this hook exists to lint.
  #
  # No Prettier hook: the repo carries no Prettier devDependency, no
  # .prettierrc, and CI (.github/workflows/ci.yml) never runs it — ESLint is
  # the only formatting/lint gate this repo already owns.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx --no-install eslint --fix --max-warnings=0
        language: system
        files: \.(ts|tsx|js|mjs|cjs)$
        exclude: ^docs/\.vitepress/
